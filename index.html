<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Store - حاسبة شي إن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #e84393; /* لون براند مميز */
            --success-color: #27ae60;
            --bg-color: #dfe6e9;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 6px solid var(--accent-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .header p {
            color: #636e72;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #2d3436;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 8px rgba(232, 67, 147, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #000;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .results-area {
            margin-top: 25px;
            display: none; /* مخفي حتى يتم الحساب */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            color: #444;
        }

        .result-row.total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 800;
        }

        .deposit-highlight {
            background: #e1f5fe;
            color: #0288d1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BRAND STORE</h1>
        <p>حاسبة طلبات شي إن الذكية</p>
    </div>

    <div class="form-group">
        <label>إجمالي مبلغ الشنطة (بالريال):</label>
        <input type="number" id="bagAmount" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
        <label>نوع الشحن:</label>
        <select id="shippingMode">
            <option value="air">شحن جوي</option>
            <option value="land">شحن بري</option>
        </select>
    </div>

    <div class="form-group">
        <label>نسبة العربون (Deposit):</label>
        <select id="depositRate">
            <option value="75">دفع مقدم 75%</option>
            <option value="50">دفع مقدم 50%</option>
        </select>
    </div>

    <button onclick="processCalculation()">احسب التكلفة</button>

    <div id="output" class="results-area">
        <div class="result-card">
            <div id="depositInfo" class="deposit-highlight"></div>
            
            <div class="result-row">
                <span>السعر بالريال (+20%):</span>
                <span id="priceInRiyal"></span>
            </div>
            
            <div class="result-row">
                <span>سعر صرف الريال:</span>
                <span id="rateUsed"></span>
            </div>

            <div class="result-row">
                <span>المتبقي عند الاستلام:</span>
                <span id="remainingBalance"></span>
            </div>

            <div class="result-row total">
                <span>الإجمالي الكلي:</span>
                <span id="totalFinal"></span>
            </div>
        </div>
    </div>
</div>

<script>
    function processCalculation() {
        // جلب المدخلات
        const amount = parseFloat(document.getElementById('bagAmount').value);
        const mode = document.getElementById('shippingMode').value;
        const depositPercent = parseFloat(document.getElementById('depositRate').value);

        if (!amount || amount <= 0) {
            alert("يا طارق، برجاء إدخال مبلغ الشنطة أولاً");
            return;
        }

        // 1. إضافة الـ 20%
        const amountWithCommission = amount * 1.20;

        // 2. تحديد سعر الريال (جوي vs بري)
        let exchangeRate = 0;
        if (mode === 'air') {
            exchangeRate = (depositPercent === 75) ? 14 : 14.5;
        } else {
            exchangeRate = (depositPercent === 75) ? 12.5 : 13;
        }

        // 3. الحسابات المالية بالجنيه
        const totalEGP = amountWithCommission * exchangeRate;
        const depositRequired = totalEGP * (depositPercent / 100);
        const restOfAmount = totalEGP - depositRequired;

        // 4. تحديث الواجهة بالنتائج
        document.getElementById('priceInRiyal').innerText = amountWithCommission.toFixed(2) + " ريال";
        document.getElementById('rateUsed').innerText = exchangeRate + " ج.م";
        document.getElementById('depositInfo').innerText = "المطلوب دفعه الآن (عربون): " + depositRequired.toLocaleString('en-EG', {maximumFractionDigits: 0}) + " ج.م";
        document.getElementById('remainingBalance').innerText = restOfAmount.toLocaleString('en-EG', {maximumFractionDigits: 0}) + " ج.م";
        document.getElementById('totalFinal').innerText = totalEGP.toLocaleString('en-EG', {maximumFractionDigits: 0}) + " ج.م";

        // إظهار منطقة النتائج
        document.getElementById('output').style.display = 'block';
    }
</script>

</body>
</html>
